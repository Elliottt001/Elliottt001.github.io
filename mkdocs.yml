# [Info]
# 站点名称：显示在浏览器标题、页面页眉和主题导航中。
site_name: Note

# 站点线上地址：用于生成 sitemap、canonical URL、RSS 等绝对链接。
site_url: https://note.elliotttzhang.cn/

# 站点作者：写入页面元信息，便于主题和插件读取。
site_author: Elliottt Zhang

# 站点描述：写入 HTML meta description，影响搜索结果摘要。
site_description: 这里放着一些 Elliottt Zhang 的笔记

# 构建钩子：在构建前把根目录 assets/ 复制到 docs/assets/
hooks:
  - hooks/copy_assets.py

