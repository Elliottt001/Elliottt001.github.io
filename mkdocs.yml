theme:
  # 使用 MkDocs Material 主题。
  name: material

  # 浏览器标签页和收藏夹使用的站点图标。
  favicon: assets/images/logo.png

  # 自定义主题覆盖目录；当前用于放置评论等模板片段。
  custom_dir: overrides

  # 明暗主题配色：提供自动、亮色、暗色三种入口。
  palette:
    # 自动模式：跟随浏览器或操作系统的颜色偏好。
    - media: "(prefers-color-scheme)"
      # 自动模式按钮设置。
      toggle:
        # 自动模式按钮图标。
        icon: material/brightness-auto
        # 自动模式按钮提示文案。
        name: 跟随系统

    # 亮色模式：使用 Material 默认浅色方案。
    - media: "(prefers-color-scheme: light)"
      # 亮色模式主题方案。
      scheme: default
      # 亮色模式主色（深蓝灰，接近参考项目 navy）。
      primary: blue grey
      # 亮色模式强调色（薄荷绿，用于链接和交互元素）。
      accent: teal
      # 亮色模式按钮设置。
      toggle:
        # 亮色模式按钮图标。
        icon: material/weather-sunny
        # 亮色模式按钮提示文案。
        name: 切换到深色模式

    # 暗色模式：使用 Material 的 slate 深色方案。
    - media: "(prefers-color-scheme: dark)"
      # 暗色模式主题方案。
      scheme: slate
      # 暗色模式主色（纯黑，配合 CSS 覆盖为 navy）。
      primary: black
      # 暗色模式强调色（薄荷绿）。
      accent: teal
      # 暗色模式按钮设置。
      toggle:
        # 暗色模式按钮图标。
        icon: material/weather-night
        # 暗色模式按钮提示文案。
        name: 切换到系统偏好

  # 禁用主题默认在线字体加载，避免依赖 Google Fonts。
  font: false

  # 主题功能开关：保留当前站点实际启用的交互能力。
  features:
    # 顶层导航以标签页形式展示。
    - navigation.tabs
    # 页面滚动后显示返回顶部按钮。
    - navigation.top
    # 点击分区导航时优先打开该分区的 index.md。
    - navigation.indexes
    # 右侧目录跟随页面滚动同步高亮。
    - toc.follow
    # 搜索框提供关键词补全建议。
    - search.suggest
    # 搜索结果页高亮匹配关键词。
    - search.highlight
    # 代码块显示复制按钮。
    - content.code.copy
    # 页面正文显示“编辑此页”的入口。
    - content.action.edit
    # 允许用户关闭公告横幅。
    - announce.dismiss

  # 主题图标配置：控制站点 Logo、仓库入口、编辑按钮和提示块图标。
  icon:
    # 顶部站点 Logo 图标。
    logo: material/library-outline
    # 右上角仓库链接图标。
    repo: fontawesome/brands/github
    # “编辑此页”动作图标。
    edit: material/pencil
    # “查看源码”动作图标。
    view: material/eye
    # Admonition 提示块图标映射。
    admonition:
      # note 提示块图标。
      note: octicons/tag-16
      # abstract 提示块图标。
      abstract: octicons/checklist-16
      # info 提示块图标。
      info: octicons/info-16
      # tip 提示块图标。
      tip: octicons/squirrel-16
      # success 提示块图标。
      success: octicons/check-16
      # question 提示块图标。
      question: octicons/question-16
      # warning 提示块图标。
      warning: octicons/alert-16
      # failure 提示块图标。
      failure: octicons/x-circle-16
      # danger 提示块图标。
      danger: octicons/zap-16
      # bug 提示块图标。
      bug: octicons/bug-16
      # example 提示块图标。
      example: octicons/beaker-16
      # quote 提示块图标。
      quote: octicons/quote-16
    # Markdown 注释标记的图标。
    annotation: material/checkbox-marked-circle-auto-outline

# 页面编辑链接前缀：与 repo_url 拼接后跳转到 GitHub 上的 Markdown 源文件。
edit_uri: edit/main/docs/

# 仓库地址：用于右上角仓库入口和页面编辑入口。
repo_url: https://github.com/Elliottt001/Elliottt001.github.io

# 仓库展示名：显示在主题右上角仓库按钮旁。
repo_name: Elliottt001.github.io

# 页脚版权信息：支持 HTML，用于保留 Cookie 设置入口。
copyright: >
  Copyright © 2024 Elliottt Zhang All rights reserved.

  <a href="#__consent">Cookie 设置</a>

# 主题扩展信息：控制页脚社交链接、生成器标识和 Cookie 授权弹窗。
extra:
  # 页脚社交链接列表。
  social:
    - name: GitHub | Elliottt001
      icon: fontawesome/brands/github
      link: https://github.com/Elliottt001
    - name: Email | Elliottt001
      icon: fontawesome/solid/envelope
      link: mailto:rzzhangzju@gmail.com
    - name: Personal Website
      icon: fontawesome/solid/globe
      link: https://me.elliotttzhang.cn
    - name: LinkedIn | Elliottt001
      icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/%E7%91%9E%E5%96%86-%E5%BC%A0-23ba9b380/

  # 关闭页脚默认的 “Made with Material for MkDocs” 标识。
  generator: false

  # Cookie 授权弹窗配置。
  consent:
    # 弹窗标题。
    title: Cookie 设置
    # 弹窗说明：使用本站自己的说明，避免保留默认示例文案。
    description: >-
      本站可能使用必要 Cookie 记录偏好设置，并在启用统计服务时用于匿名访问分析。
      你可以在这里管理授权。
    # 可管理的 Cookie 类型。
    cookies:
      # 访问统计授权项；默认不勾选。
      analytics:
        # 统计 Cookie 在弹窗中的展示名称。
        name: 访问统计
        # 默认不启用统计 Cookie。
        checked: True
    # 弹窗按钮动作。
    actions:
      # 接受当前 Cookie 设置。
      - accept
      # 打开 Cookie 管理面板。
      - manage

# [Plugins]
# MkDocs 插件：控制搜索、标签、图片灯箱、页面统计、修订时间、RSS、更新日志和压缩。
plugins:
  # 全文搜索插件；lang 配置用于中文、英文和西文内容检索。
  - search:
      # 搜索分词语言列表。
      lang:
        # 中文内容。
        - zh
        # 英文内容。
        - en
        # 西文内容。
        - es

  # 标签插件：读取页面 meta.tags 并生成标签索引。
  - tags

  # 图片灯箱插件：点击图片后放大预览。
  - glightbox

  # 页面统计插件：显示字数、代码行数和预计阅读时间。
  - statistics

  # Git 修订时间插件：显示页面最后更新和创建时间。
  - git-revision-date-localized:
      # 日期显示精确到日期和时间。
      type: datetime
      # 使用站点主要受众所在时区。
      timezone: Asia/Shanghai
      # 日期本地化语言。
      locale: zh
      # 同时显示页面创建时间。
      enable_creation_date: true
      # 不需要显示修订时间的页面。
      exclude:
        # 首页不显示修订时间。
        - index.md
        # 指定 writeup 页面不显示修订时间。
        - writeups/AAA.md

  # RSS 插件：根据站点页面生成订阅源。
  - rss

  # 更新日志插件：根据 docs/changelog.yml 生成 changelog 页面。
  - changelog

  # HTML 压缩插件：减小构建后页面体积。
  - minify:
      # 启用 HTML 压缩。
      minify_html: true

# Markdown 扩展：控制目录、提示块、代码高亮、任务列表、公式、表格等语法能力。
markdown_extensions:
  # 自动生成页面目录。
  - toc:
      # 标题旁显示可复制的锚点链接。
      permalink: true
      # 目录最多包含 5 级标题。
      toc_depth: 5

  # 启用 !!! note 这类提示块语法。
  - admonition

  # 代码块语法高亮配置。
  - pymdownx.highlight:
      # 允许行号锚点。
      anchor_linenums: true
      # 为每行代码生成 span，便于主题样式定位。
      line_spans: __span
      # 为代码块添加语言类名。
      pygments_lang_class: true

  # 内联代码语法高亮。
  - pymdownx.inlinehilite

  # 允许在 Markdown 中嵌入外部文件片段。
  - pymdownx.snippets

  # 增强代码围栏，支持在提示块、选项卡和列表中嵌套代码块。
  - pymdownx.superfences:
      # 自定义代码围栏类型。
      custom_fences:
        # Mermaid 图表围栏。
        - name: mermaid
          # 渲染 Mermaid 所需的 CSS 类名。
          class: mermaid
          # 使用 pymdownx 默认代码围栏格式化函数。
          format: !!python/name:pymdownx.superfences.fence_code_format

  # 允许提示块折叠展开。
  - pymdownx.details

  # 允许用 Markdown 语法为元素添加 HTML 属性和 CSS 类。
  - attr_list

  # 允许在 HTML 块内部继续解析 Markdown。
  - md_in_html

  # 支持图片、表格等内容的 caption 写法。
  - pymdownx.blocks.caption

  # 支持键盘按键样式，例如 ++ctrl+c++。
  - pymdownx.keys

  # 支持上标和插入标记语法。
  - pymdownx.caret

  # 支持文本高亮标记语法。
  - pymdownx.mark

  # 支持删除线和下标语法。
  - pymdownx.tilde

  # 支持 CriticMarkup 的增删改批注语法。
  - pymdownx.critic

  # Emoji 渲染配置。
  - pymdownx.emoji:
      # 使用 Material 提供的 Twemoji 索引。
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      # 将 emoji 渲染为 SVG。
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # 支持内容或代码块分组选项卡。
  - pymdownx.tabbed:
      # 使用 Material 推荐的新式选项卡样式。
      alternate_style: true

  # 支持任务清单语法，例如 - [x]。
  - pymdownx.tasklist:
      # 使用主题自定义复选框样式。
      custom_checkbox: true

  # 数学公式扩展；配合 extra_javascript 中的 MathJax 使用。
  - pymdownx.arithmatex:
      # 输出通用公式标记，交给 MathJax 在前端渲染。
      generic: true

  # 支持定义列表语法。
  - def_list

  # 允许页面级 YAML front matter。
  - meta

  # 使用更符合直觉的有序/无序列表解析规则。
  - sane_lists

  # 自动识别裸链接、issue、commit 等常见链接文本。
  - pymdownx.magiclink

# 额外 CSS：按顺序覆盖主题样式。
extra_css:
  # 卡片布局样式。
  - assets/mkdocs/css/card.css
  # 友链或链接卡片样式。
  - assets/mkdocs/css/flink.css
  # 站点自定义通用样式。
  - assets/mkdocs/css/custom.css
  # 额外覆盖样式。
  - assets/mkdocs/css/extra.css
  # LXGW WenKai 在线字体样式。
  - https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css

# 额外 JavaScript：用于前端增强能力。
extra_javascript:
  # MathJax 初始化脚本。
  - assets/mkdocs/javascripts/mathjax.js
  # MathJax 3 CDN，用于渲染 TeX、MathML 和 CHTML。
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
