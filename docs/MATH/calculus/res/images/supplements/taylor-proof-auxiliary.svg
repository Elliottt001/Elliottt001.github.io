<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">泰勒余项证明：先构造辅助函数</title>
<desc id="desc">固定 x ≠ a，令 M = [f(x) − Pₙ(x)] / (x−a)ⁿ⁺¹。；设 F(t) = f(x) − ∑(k=0…n) f⁽ᵏ⁾(t)(x−t)ᵏ/k! − M(x−t)ⁿ⁺¹。；由 M 的定义，F(a) = 0；直接代入得到 F(x) = 0。；在 a 与 x 之间对 F 使用罗尔定理。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 泰勒余项证明：先构造辅助函数</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">固定 x ≠ a，令 M = [f(x) − Pₙ(x)] / (x−a)ⁿ⁺¹。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">设 F(t) = f(x) − ∑(k=0…n) f⁽ᵏ⁾(t)(x−t)ᵏ/k! − M(x−t)ⁿ⁺¹。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">由 M 的定义，F(a) = 0；直接代入得到 F(x) = 0。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">在 a 与 x 之间对 F 使用罗尔定理。</text>
</svg>
