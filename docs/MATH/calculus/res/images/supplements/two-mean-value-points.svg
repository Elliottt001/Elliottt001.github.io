<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">把区间拆成两段分别用中值定理</title>
<desc id="desc">条件：f(a) = f(b)，取 a &lt; c &lt; b。；存在 ξ₁ ∈ (a,c)：f′(ξ₁) = [f(c)−f(a)]/(c−a)。；存在 ξ₂ ∈ (c,b)：f′(ξ₂) = [f(b)−f(c)]/(b−c)。；因此 (c−a)f′(ξ₁) + (b−c)f′(ξ₂) = 0。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 把区间拆成两段分别用中值定理</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">条件：f(a) = f(b)，取 a &lt; c &lt; b。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">存在 ξ₁ ∈ (a,c)：f′(ξ₁) = [f(c)−f(a)]/(c−a)。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">存在 ξ₂ ∈ (c,b)：f′(ξ₂) = [f(b)−f(c)]/(b−c)。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">因此 (c−a)f′(ξ₁) + (b−c)f′(ξ₂) = 0。</text>
</svg>
