<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">展开式需要说明适用范围</title>
<desc id="desc">ln(1+x) = x − x²/2 + x³/3 − ⋯，−1 &lt; x ≤ 1。；x = 1 时得到交错调和级数，和为 ln 2。；x = −1 时原函数无定义，相应级数也发散。；局部近似还应说明自变量趋向的展开中心。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 展开式需要说明适用范围</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">ln(1+x) = x − x²/2 + x³/3 − ⋯，−1 &lt; x ≤ 1。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">x = 1 时得到交错调和级数，和为 ln 2。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">x = −1 时原函数无定义，相应级数也发散。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">局部近似还应说明自变量趋向的展开中心。</text>
</svg>
