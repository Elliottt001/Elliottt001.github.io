<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">拉格朗日中值定理给出的差值界</title>
<desc id="desc">f 在 [a,b] 连续、在 (a,b) 可导，且 |f′(t)| ≤ M。；对任意 x ∈ (a,b)，存在 ξ ∈ (a,x)：f(x)−f(a) = f′(ξ)(x−a)。；因此 |f(x)−f(a)| ≤ M|x−a|。；例如在 [1,2] 上，|(ln x)′| ≤ 1，所以 |ln x| ≤ x−1。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 拉格朗日中值定理给出的差值界</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">f 在 [a,b] 连续、在 (a,b) 可导，且 |f′(t)| ≤ M。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">对任意 x ∈ (a,b)，存在 ξ ∈ (a,x)：f(x)−f(a) = f′(ξ)(x−a)。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">因此 |f(x)−f(a)| ≤ M|x−a|。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">例如在 [1,2] 上，|(ln x)′| ≤ 1，所以 |ln x| ≤ x−1。</text>
</svg>
