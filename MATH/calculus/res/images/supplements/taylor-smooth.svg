<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">无穷次可导不保证等于自己的泰勒级数</title>
<desc id="desc">例：f(0) = 0，x ≠ 0 时 f(x) = exp(−1/x²)。；它在 0 处的各阶导数均为 0。；在 0 处的泰勒级数因此恒等于 0。；但 x ≠ 0 时 f(x) &gt; 0；需要另行判断余项能否趋于 0。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 无穷次可导不保证等于自己的泰勒级数</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">例：f(0) = 0，x ≠ 0 时 f(x) = exp(−1/x²)。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">它在 0 处的各阶导数均为 0。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">在 0 处的泰勒级数因此恒等于 0。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">但 x ≠ 0 时 f(x) &gt; 0；需要另行判断余项能否趋于 0。</text>
</svg>
