<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">参数方程的一阶与二阶导数</title>
<desc id="desc">若 x = x(t)，y = y(t)，且 x′(t) ≠ 0：；dy/dx = y′(t)/x′(t)，d²y/dx² = [d/dt(dy/dx)]/x′(t)。；例：x = t²，y = t³，t ≠ 0。；dy/dx = 3t/2，d²y/dx² = 3/(4t)。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 参数方程的一阶与二阶导数</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">若 x = x(t)，y = y(t)，且 x′(t) ≠ 0：</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">dy/dx = y′(t)/x′(t)，d²y/dx² = [d/dt(dy/dx)]/x′(t)。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">例：x = t²，y = t³，t ≠ 0。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">dy/dx = 3t/2，d²y/dx² = 3/(4t)。</text>
</svg>
