<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">分式求导与先做除法</title>
<desc id="desc">(u/v)′ = (u′v − uv′)/v²，v ≠ 0。；例如 [x/(x+1)]′ = 1/(x+1)²。；若分子次数不低于分母，先做多项式除法可以简化。；如 (x²+1)/(x+1) = x−1 + 2/(x+1)。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 分式求导与先做除法</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">(u/v)′ = (u′v − uv′)/v²，v ≠ 0。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">例如 [x/(x+1)]′ = 1/(x+1)²。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">若分子次数不低于分母，先做多项式除法可以简化。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">如 (x²+1)/(x+1) = x−1 + 2/(x+1)。</text>
</svg>
