<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">内点最大值与右端点导数：一个二阶可导例子</title>
<desc id="desc">取 f(x) = x(2−x)，x ≥ 0。；在区间 (0,2) 的 x = 1 处取得最大值，f′(1) = 0。；f′′(x) = −2，因此导数随 x 增大而减小。；右端点 x = 2 的导数 f′(2) = −2。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 内点最大值与右端点导数：一个二阶可导例子</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">取 f(x) = x(2−x)，x ≥ 0。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">在区间 (0,2) 的 x = 1 处取得最大值，f′(1) = 0。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">f′′(x) = −2，因此导数随 x 增大而减小。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">右端点 x = 2 的导数 f′(2) = −2。</text>
</svg>
