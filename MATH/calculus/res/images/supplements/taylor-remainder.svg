<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">带拉格朗日余项的泰勒公式</title>
<desc id="desc">f(x) = Pₙ(x) + Rₙ(x)，展开中心为 a。；Pₙ(x) = ∑(k=0…n) f⁽ᵏ⁾(a)(x−a)ᵏ / k!。；Rₙ(x) = f⁽ⁿ⁺¹⁾(ξ)(x−a)ⁿ⁺¹ / (n+1)!，ξ 在 a、x 之间。；条件：区间上具有相应阶数的连续性与可导性。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 带拉格朗日余项的泰勒公式</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">f(x) = Pₙ(x) + Rₙ(x)，展开中心为 a。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">Pₙ(x) = ∑(k=0…n) f⁽ᵏ⁾(a)(x−a)ᵏ / k!。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">Rₙ(x) = f⁽ⁿ⁺¹⁾(ξ)(x−a)ⁿ⁺¹ / (n+1)!，ξ 在 a、x 之间。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">条件：区间上具有相应阶数的连续性与可导性。</text>
</svg>
