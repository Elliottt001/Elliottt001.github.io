<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">等价无穷小：乘除可换，消去项需谨慎</title>
<desc id="desc">x → 0 时，sin x ∼ x，因此 sin x / x → 1。；但差式 sin x − x 中，两项的一阶部分相消。；sin x − x = −x³/6 + o(x³)。；所以 (sin x − x)/x³ → −1/6，不能把分子替换成 0。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 等价无穷小：乘除可换，消去项需谨慎</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">x → 0 时，sin x ∼ x，因此 sin x / x → 1。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">但差式 sin x − x 中，两项的一阶部分相消。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">sin x − x = −x³/6 + o(x³)。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">所以 (sin x − x)/x³ → −1/6，不能把分子替换成 0。</text>
</svg>
