<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="title desc">
<title id="title">有限展开与无穷级数的区别</title>
<desc id="desc">有限阶展开必须保留余项：eˣ = 1 + x + x²/2 + o(x²)，x → 0。；无穷级数：eˣ = ∑(k=0…∞) xᵏ/k!。；求近似值用有限多项式，并估计截断误差。；不能把有限阶小 o 余项当成无穷和的额外一项。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .curve{fill:none;stroke:#12665e;stroke-width:3} .line{fill:none;stroke:#b35d35;stroke-width:2.5} .axis{stroke:#8da19d;stroke-width:1.5}</style>
<rect x="1" y="1" width="958" height="372" rx="14" fill="#f3f6f5" stroke="#d4dfdd"/>
<text x="32" y="45" fill="#142536" font-size="28" text-anchor="start">补充图 · 有限展开与无穷级数的区别</text>
<text x="32" y="76" fill="#536573" font-size="16" text-anchor="start">根据本节知识点绘制</text>
<text x="40" y="125" fill="#142536" font-size="24" text-anchor="start">有限阶展开必须保留余项：eˣ = 1 + x + x²/2 + o(x²)，x → 0。</text>
<text x="40" y="171" fill="#142536" font-size="24" text-anchor="start">无穷级数：eˣ = ∑(k=0…∞) xᵏ/k!。</text>
<text x="40" y="217" fill="#142536" font-size="24" text-anchor="start">求近似值用有限多项式，并估计截断误差。</text>
<text x="40" y="263" fill="#142536" font-size="24" text-anchor="start">不能把有限阶小 o 余项当成无穷和的额外一项。</text>
</svg>
