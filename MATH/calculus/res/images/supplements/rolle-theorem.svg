<title id="title">罗尔定理：相同高度之间有水平切线</title>
<desc id="desc">f(x) = (x − 1)²，x ∈ [0, 2]；f(0) = f(2) = 1；连续于 [0, 2]，可导于 (0, 2)；存在 ξ = 1，使 f′(ξ) = 0</desc>
